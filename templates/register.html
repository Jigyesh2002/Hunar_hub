{% extends 'base.html' %}
{% block content %}
<!-- Dark Hero Sub-Header -->
<div class="page-header text-center">
  <div class="container">
    <div class="hero-eyebrow animate-fade-in" style="justify-content: center;">
      Customer Account Creation
    </div>
    <h1 class="hero-title animate-fade-in mb-2" style="font-size: 2.8rem;">
      Hire Skilled <span>Artisans</span>
    </h1>
    <p class="hero-subtitle animate-fade-in mb-0" style="max-width: 500px;">
      Join HunarHub to book local Kaorigars with transparent pricing
    </p>
  </div>
</div>

<!-- Floating Content Card Section -->
<div class="container overlap-container" style="max-width: 560px;">
  <div class="card p-4 p-md-5 shadow-lg">
    <div class="text-center mb-4">
      <div class="category-icon-box mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">Customer Registration</h3>
      <p class="text-muted small">Fill out details to start booking</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1" style="color: #d946ef;"></i>Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope me-1" style="color: #8b5cf6;"></i>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-telephone me-1 text-amber"></i>Phone Number</label>
        <input type="text" name="phone" class="form-control" placeholder="9876543210" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-geo-alt me-1 text-emerald"></i>City</label>
          <input type="text" name="city" class="form-control" placeholder="Jaipur" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-building me-1" style="color: #d946ef;"></i>Area / Locality</label>
          <input type="text" name="area" class="form-control" placeholder="Malviya Nagar" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1 text-secondary"></i>Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">
        <i class="bi bi-person-check-fill me-1"></i>Create Customer Account
      </button>
    </form>
  </div>
</div>
{% endblock %}
