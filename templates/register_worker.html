{% extends 'base.html' %}
{% block content %}
<!-- Dark Hero Sub-Header -->
<div class="page-header text-center">
  <div class="container">
    <div class="hero-eyebrow animate-fade-in" style="justify-content: center;">
      Artisan Onboarding Portal
    </div>
    <h1 class="hero-title animate-fade-in mb-2" style="font-size: 2.8rem;">
      Join as a <span>Verified Kaorigar</span>
    </h1>
    <p class="hero-subtitle animate-fade-in mb-0" style="max-width: 550px;">
      Register your skill profile, set hourly rates, and receive local work orders
    </p>
  </div>
</div>

<!-- Floating Content Card Section -->
<div class="container overlap-container" style="max-width: 700px;">
  <div class="card p-4 p-md-5 shadow-lg">
    <div class="text-center mb-4">
      <div class="category-icon-box mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
        <i class="bi bi-tools"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">Artisan Registration</h3>
      <p class="text-muted small">Fill out profile details below</p>
    </div>

    <form method="POST">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-person me-1" style="color: #d946ef;"></i>Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Ramesh Kumar" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-envelope me-1" style="color: #8b5cf6;"></i>Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="ramesh@example.com" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-telephone me-1 text-amber"></i>Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="9911100011" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-lock me-1 text-secondary"></i>Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-tools me-1" style="color: #d946ef;"></i>Primary Skill Category</label>
          <input type="text" name="primary_skill" class="form-control" placeholder="e.g. Carpentry, Tailoring" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-currency-rupee me-1 text-emerald"></i>Standard Hourly Rate (₹)</label>
          <input type="number" name="price_per_hour" class="form-control" placeholder="350" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-geo-alt me-1 text-emerald"></i>City</label>
          <input type="text" name="city" class="form-control" placeholder="Jaipur" required>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-building me-1" style="color: #d946ef;"></i>Area / Locality</label>
          <input type="text" name="area" class="form-control" placeholder="Malviya Nagar" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="bi bi-geo me-1 text-secondary"></i>Full Address</label>
        <textarea name="address" class="form-control" rows="2" placeholder="Street 4, Sector 2..." required></textarea>
      </div>

      <div class="mb-4">
        <label class="form-label"><i class="bi bi-card-text me-1" style="color: #8b5cf6;"></i>Work Background / Bio</label>
        <textarea name="about" class="form-control" rows="3" placeholder="Describe your experience, specialization, and tools..."></textarea>
      </div>

      <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">
        <i class="bi bi-check-circle-fill me-1"></i>Submit Artisan Registration
      </button>
    </form>
  </div>
</div>
{% endblock %}
