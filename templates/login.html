{% extends 'base.html' %}
{% block content %}
<!-- Dark Hero Sub-Header -->
<div class="page-header text-center">
  <div class="container">
    <div class="hero-eyebrow animate-fade-in" style="justify-content: center;">
      Authentication Portal
    </div>
    <h1 class="hero-title animate-fade-in mb-2" style="font-size: 2.8rem;">
      Welcome Back to <span>HunarHub</span>
    </h1>
    <p class="hero-subtitle animate-fade-in mb-0" style="max-width: 500px;">
      Sign in to manage bookings, services, and profile settings
    </p>
  </div>
</div>

<!-- Floating Content Card Section -->
<div class="container overlap-container" style="max-width: 480px;">
  <div class="card p-4 p-md-5 shadow-lg">
    <div class="text-center mb-4">
      <div class="category-icon-box mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">Sign In</h3>
      <p class="text-muted small">Enter your credentials below</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope me-1" style="color: #d946ef;"></i>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1 text-secondary"></i>Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg mb-3 shadow-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
      <p class="text-muted small mb-0">Don't have an account?</p>
      <div class="d-flex justify-content-center gap-2 mt-2">
        <a href="{{ url_for('register') }}" class="btn btn-outline-primary btn-sm">Customer Sign Up</a>
        <a href="{{ url_for('register_worker') }}" class="btn btn-outline-secondary btn-sm">Artisan Registration</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
